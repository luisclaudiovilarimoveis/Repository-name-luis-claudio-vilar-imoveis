<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061735">
  <title>Sem conexão — Luis Claudio Vilar</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#061735;color:#fff;font-family:Arial,sans-serif;text-align:center}
    main{max-width:560px}
    h1{font-size:30px;margin:0 0 12px}
    p{font-size:18px;line-height:1.5;margin:0 0 22px}
    button{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:14px 22px;background:#675d55;color:#fff;font-size:17px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>Você está sem conexão</h1>
    <p>Conecte-se à internet e toque abaixo para abrir novamente o cartão digital.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
